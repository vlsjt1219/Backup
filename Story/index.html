<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{if(localStorage.getItem('mafiaz_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
    <title>MAFIAZ - Story</title>

    <!-- Supabase SDK & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- CSS 파일 연동 -->
    <link rel="stylesheet" href="../editor.css">
    <link rel="stylesheet" href="../site.css">
    <link rel="stylesheet" href="./story.css">

    <!-- 웹폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Zen+Antique&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;700&family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
</head>
<body>

<!-- 페이지 뒷배경 -->
<div id="pageBg"></div>

<!-- 왼쪽 네비게이션 -->
<nav id="siteNav">
    <a href="../index.html">Home</a>
    <a href="./index.html" class="is-active">Story</a>
    <a href="../Character/index.html">Character</a>
    <a href="../Gallery/index.html">Gallery</a>
</nav>

<!-- 화면 스테이지 영역 -->
<div id="stageArea">
  <div id="stageFrame">
    <div id="mh-gpfto" class="mh">
      <div class="mh-bg"></div>
      <div class="mh-fx"></div>
      <div class="mh-in">
        <div class="mh-win">
          <div class="mh-bar">
            <span class="mh-ttl">STORY</span>
            <span class="mh-btns" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
          <div class="char-adminbar" id="adminBar" style="display:none;">
              <span>🛠️ 관리자 모드 — 스토리 자유 배치 및 수정이 가능합니다.</span>
              <button type="button" class="btn" id="logoutBtn">로그아웃</button>
          </div>

            <!-- 메인 페이지와 동일한 자유 배치 보드 영역 -->
          <div class="mh-body mh-free" id="draggableGallery" style="position: relative; width: 100%; height: 100%;">
              <!-- 가이드라인 (관리자 모드 전용) -->
              <div id="centerSnapLineV" style="position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #ff4757; z-index: 99999; display: none; pointer-events: none;"></div>
              <div id="centerSnapLineH" style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #ff4757; z-index: 99999; display: none; pointer-events: none;"></div>
              <div id="elemSnapLineV" style="position: absolute; top: 0; bottom: 0; width: 1px; background: #2ed573; z-index: 99999; display: none; pointer-events: none;"></div>
              <div id="elemSnapLineH" style="position: absolute; left: 0; right: 0; height: 1px; background: #2ed573; z-index: 99999; display: none; pointer-events: none;"></div>
              <div id="selectionMarquee" style="position: absolute; border: 1px dashed #c9a86a; background: rgba(201,168,106,0.15); z-index: 99998; display: none; pointer-events: none;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 이미지 구도 편집 모달 (에디터 공용) -->
<div id="imageEditModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200000; align-items:center; justify-content:center;">
    <div style="background:#13151f; border:1px solid #c9a86a; padding:20px; border-radius:8px; width:420px; color:#ece5d3;">
        <h3 style="margin:0 0 12px; color:#c9a86a; font-size:1em;">🖼️ 이미지 구도 및 줌 편집</h3>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
            <button type="button" id="editTabA" style="flex:1; background:#c9a86a; color:#111; border:none; padding:6px; border-radius:4px; font-weight:bold; cursor:pointer;">이미지 A (메인)</button>
            <button type="button" id="editTabB" style="flex:1; background:#1f1f2a; color:#ece5d3; border:1px solid #444; padding:6px; border-radius:4px; cursor:pointer;">이미지 B (오버)</button>
        </div>
        <div id="cropPreviewContainer" style="width:390px; height:300px; background:#000; overflow:hidden; position:relative; margin:0 auto 12px; border:1px dashed #444; cursor:grab; display:flex; align-items:center; justify-content:center;">
            <div id="cropInnerBox" style="position:relative; width:100%; height:100%; overflow:hidden;">
                <img id="modalTargetImg" style="position:absolute; max-width:none; max-height:none; pointer-events:none;" />
            </div>
        </div>
        <div style="margin-bottom:12px;">
            <label style="font-size:0.85em; color:#9d947e; display:block; margin-bottom:4px;">확대/축소 (Scale)</label>
            <input type="range" id="modalImgScale" min="0.5" max="3" step="0.05" value="1" style="width:100%; accent-color:#c9a86a;">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:6px;">
            <button type="button" id="closeImgModal" class="btn" style="padding:4px 12px;">취소</button>
            <button type="button" id="applyImgModal" class="btn btn_primary" style="padding:4px 12px;">적용</button>
        </div>
    </div>
</div>

<script src="../common.js"></script>
<script src="../editor.js"></script>
<script>
    MZ.initLogin({ onLogin: () => location.reload(), onLogout: () => location.reload() });
    const admin = MZ.isAdmin();
    if (admin) {
        const bar = document.getElementById('adminBar');
        if (bar) bar.style.display = 'flex';
    }
    // 스토리 페이지 전용 데이터 키('story')를 사용하여 에디터 실행
    startEditor(admin, 'story');
</script>

</body>
</html>
