<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MAFIAZ - Gallery</title>

    <!-- Supabase SDK & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- 사이트 공통 스타일 -->
    <link rel="stylesheet" href="../editor.css">
    <link rel="stylesheet" href="../site.css">
    <link rel="stylesheet" href="../style.css">

    <!-- 웹폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; overflow-y: auto; background: #0c0d10; }

        /* 화면 전체 활용 스테이지 영역 */
        #galleryStageArea {
            position: relative;
            z-index: 1;
            margin-left: var(--nav-w, 180px);
            min-height: 100vh;
            padding: 60px 200px 80px;
            box-sizing: border-box;
        }

        .gallery-main-container { width: 100%; margin: 0 auto; }

        /* 카테고리 & 태그 필터 영역 */
        .category-filter-wrap { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .cate-btn {
            background: rgba(255, 255, 255, 0.85); border: 1px solid #ddd; color: #555;
            padding: 6px 20px; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .cate-btn.active { background: #ffffff; color: #111; border-color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

        .tag-filter-wrap { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-bottom: 25px; min-height: 36px; }
        .tag-btn {
            background: var(--tag-bg, rgba(255, 255, 255, 0.85));
            border: var(--tag-border, 1px solid #ddd);
            color: var(--tag-color, #555);
            padding: 5px 16px; border-radius: 15px; font-size: 13px; font-weight: bold; cursor: pointer; transition: background 0.2s, color 0.2s;
            user-select: none; touch-action: none; box-sizing: border-box;
        }
        .tag-btn:hover {
            background: var(--tag-hover-bg, #f1c40f) !important;
            color: var(--tag-hover-color, #ffffff) !important;
        }
        .tag-btn.active { background: var(--tag-hover-bg, #f1c40f); color: var(--tag-hover-color, #ffffff); border-color: transparent; }

        /* 노란 점선 가이드라인 (Placeholder) */
        .card-placeholder {
            border: 2px dashed #f1c40f !important;
            background: rgba(241, 196, 15, 0.25) !important;
            border-radius: 12px;
            aspect-ratio: 4 / 3 !important;
            box-sizing: border-box;
            pointer-events: none !important;
        }

        .tag-placeholder {
            border: 2px dashed #f1c40f !important;
            background: rgba(241, 196, 15, 0.25) !important;
            border-radius: 15px;
            width: 80px;
            height: 30px;
            display: inline-block;
            pointer-events: none !important;
            box-sizing: border-box;
        }

        /* 6열 4행 그리드 */
        .gallery-grid-6x4 {
            position: relative;
            display: grid !important;
            grid-template-columns: repeat(6, 1fr) !important;
            gap: 18px !important;
            width: 100%;
            margin-bottom: 30px;
        }

        /* 4:3 비율 카드 스타일 */
        .card-item {
            position: relative; border-radius: 12px; overflow: hidden; background: #ffffff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); transition: transform 0.2s ease, box-shadow 0.2s ease;
            aspect-ratio: 4 / 3 !important; cursor: pointer; user-select: none; touch-action: none; box-sizing: border-box;
        }
        .card-item * { pointer-events: none !important; }
        .card-item:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .card-thumb { position: relative; width: 100%; height: 100%; background-color: #111; }
        .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 60%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 14px;
            box-sizing: border-box; opacity: 0; transition: opacity 0.25s ease;
        }
        .card-item:hover .card-overlay { opacity: 1; }
        .card-title { color: #ffffff; font-size: 14px; font-weight: bold; }

        /* 이동 중인 요소 Floating 스타일 */
        .dragging-float {
            position: fixed !important;
            z-index: 999999 !important;
            pointer-events: none !important;
            opacity: 0.9 !important;
            transform: scale(1.02) !important;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6) !important;
            margin: 0 !important;
            transition: none !important;
        }

        /* 페이지네이션 버튼 */
        .pagination-wrap { display: flex; justify-content: center; align-items: center; gap: 6px; }
        .page-btn {
            background: var(--page-bg, rgba(255, 255, 255, 0.85));
            border: var(--page-border, none);
            color: var(--page-color, #333);
            padding: 6px 14px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .page-btn:hover {
            background: var(--page-hover-bg, #f1c40f) !important;
            color: var(--page-hover-color, #fff) !important;
        }
        .page-btn.active { background: var(--page-hover-bg, #f1c40f); color: var(--page-hover-color, #fff); }

        /* 우측 상단 관리자 로그인 버튼 */
        #adminEntryBtn {
            position: fixed; top: 20px; right: 20px; z-index: 99999;
            background: rgba(20, 16, 30, 0.85); border: 1px solid #c9a86a; color: #ece5d3;
            padding: 8px 16px; border-radius: 20px; font-family: 'Nanum Myeongjo', serif;
            font-size: 0.85em; font-weight: bold; cursor: pointer; backdrop-filter: blur(4px);
            transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #adminEntryBtn:hover { background: #c9a86a; color: #111; }

        /* 태그·페이징 디자인 패널 */
        #designControlPanel {
            display: none; position: fixed; top: 70px; right: 20px; background: #14161d; color: #ece5d3;
            padding: 20px; border-radius: 12px; border: 1px solid #333d52; z-index: 100000;
            font-family: 'Pretendard', sans-serif; box-shadow: 0 15px 35px rgba(0,0,0,0.7); width: 320px;
            box-sizing: border-box;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .panel-title { font-weight: bold; color: #f1c40f; font-size: 15px; display: flex; align-items: center; gap: 6px; }
        .panel-btn-save { background: #2ed573; border: none; color: #111; font-weight: bold; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
        .panel-btn-close { background: #ff4757; border: none; color: #fff; font-weight: bold; padding: 4px 12px; border-radius: 6px; cursor: pointer; margin-left: 4px; }
        
        .panel-sec-title { color: #f1c40f; font-weight: bold; font-size: 13px; margin: 15px 0 10px; border-top: 1px solid #282f3f; padding-top: 12px; }
        .panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; color: #ccc; }
        .panel-row input[type="color"] { border: none; width: 28px; height: 22px; border-radius: 4px; cursor: pointer; background: none; }
        .panel-row input[type="range"] { accent-color: #2ed573; width: 100px; }

        /* 로그인 모달 */
        #loginOverlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000000;
            backdrop-filter: blur(5px); align-items: center; justify-content: center;
            font-family: 'Nanum Myeongjo', serif; color: #ece5d3;
        }
        #loginOverlay form {
            background: #14101e; border: 1px solid #c9a86a; border-radius: 8px;
            padding: 24px; width: 300px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); position: relative;
        }
        #loginOverlay input {
            background: #111; border: 1px solid #444; color: #ece5d3;
            padding: 10px; border-radius: 4px; font-size: 0.95em; outline: none;
        }
        #loginOverlay button[type="submit"] {
            background: #c9a86a; border: none; color: #111; font-weight: bold;
            padding: 10px; border-radius: 4px; cursor: pointer; font-size: 0.95em;
        }

        /* 폴라로이드 모달 및 마우스 오버 회전 원복 애니메이션 */
        .polaroid-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
            z-index: 99998; backdrop-filter: blur(5px); justify-content: center; align-items: center;
        }
        .polaroid-frame {
            background: #ffffff; padding: 24px 24px 30px 24px; width: 560px; max-width: 92vw;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: rotate(-2deg);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.35s ease;
            position: relative; border-radius: 6px; box-sizing: border-box;
        }
        .polaroid-frame:hover {
            transform: rotate(0deg) scale(1.01);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .polaroid-img-box {
            position: relative; width: 100%; height: 500px; background: #eee; overflow: hidden; border-radius: 4px; margin-bottom: 18px; cursor: pointer;
        }
        .polaroid-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .zoom-hover-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.4); color: #fff;
            display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: bold;
            opacity: 0; transition: opacity 0.25s ease;
        }
        .polaroid-img-box:hover .zoom-hover-overlay { opacity: 1; }

        .polaroid-title-text { font-size: 22px; font-weight: bold; color: #222; margin-bottom: 8px; display: block; }
        
        /* 모달 안 태그 배지 */
        .polaroid-tag-badge {
            display: inline-block; background: #f1c40f; color: #ffffff; font-size: 12px;
            font-weight: bold; padding: 4px 12px; border-radius: 12px; margin-right: 6px; margin-bottom: 12px;
            cursor: pointer; transition: transform 0.15s ease, background-color 0.15s ease;
        }
        .polaroid-tag-badge:hover {
            transform: translateY(-2px);
            background: #e1b107;
        }

        .polaroid-desc-text { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 18px; white-space: pre-wrap; word-break: break-all; }
        .polaroid-action-btns { font-size: 13px; color: #888; }
        .polaroid-action-btns span { cursor: pointer; margin-right: 12px; text-decoration: underline; }

        .modal-nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%); font-size: 42px;
            color: rgba(255, 255, 255, 0.7); cursor: pointer; user-select: none; transition: color 0.2s; padding: 20px;
        }
        .modal-nav-btn:hover { color: #ffffff; }
        .modal-nav-prev { left: calc(50% - 350px); }
        .modal-nav-next { right: calc(50% - 350px); }

        #fullImageModal {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            z-index: 99999; justify-content: center; align-items: center; cursor: pointer;
        }
        #fullImageModal img { max-width: 95vw; max-height: 95vh; object-fit: contain; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        .uph-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
            z-index: 99999; backdrop-filter: blur(5px); justify-content: center; align-items: center;
        }
        .write-modal-box {
            width: 90%; max-width: 650px; background: rgba(20, 24, 33, 0.95);
            border: 1px solid rgba(201, 168, 106, 0.3); border-radius: 12px; padding: 25px; color: #ece5d3;
        }
        .write-input-dark {
            width: 100%; background: #2c3345; border: 1px solid #3f475d;
            color: #fff; padding: 10px 15px; border-radius: 8px; box-sizing: border-box; outline: none;
        }

        @media (max-width: 1024px) { .gallery-grid-6x4 { grid-template-columns: repeat(4, 1fr) !important; } }
        @media (max-width: 768px) {
            #galleryStageArea { margin-left: 0; padding: 70px 15px 40px; }
            .gallery-grid-6x4 { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
        }
    </style>
</head>
<body>

<div id="pageBg"></div>

<button type="button" id="adminEntryBtn" onclick="openLoginOverlay()"><i class="fa fa-cog"></i> 관리자</button>

<div id="loginOverlay">
  <form id="loginForm">
    <button type="button" style="position:absolute; top:12px; right:15px; background:none; border:none; color:#888; font-size:1.2em; cursor:pointer;" onclick="closeLoginOverlay()">✕</button>
    <div style="font-weight:bold; color:#c9a86a; font-size:1.1em; text-align:center; margin-bottom:5px;">MAFIAZ 관리자 로그인</div>
    <input type="text" id="loginEmail" placeholder="아이디" autocomplete="username" required>
    <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password" required>
    <button type="submit">로그인</button>
    <div id="loginMsg" style="color:#ff4757; font-size:0.85em; text-align:center; min-height:1em;"></div>
  </form>
</div>

<div id="designControlPanel">
    <div class="panel-header">
        <div class="panel-title"><i class="fa fa-sliders-h"></i> 태그·페이징 디자인 패널</div>
        <div>
            <button class="panel-btn-save" onclick="saveDesignSettings()">저장</button>
            <button class="panel-btn-close" onclick="closeDesignPanel()">닫기</button>
        </div>
    </div>

    <div class="panel-sec-title">태그</div>
    <div class="panel-row">
        <span>외곽선</span>
        <label><input type="checkbox" id="p_tag_border_chk" checked> 표시</label>
        <input type="color" id="p_tag_border_col" value="#ffffff">
    </div>
    <div class="panel-row">
        <span>배경색 / 투명도</span>
        <input type="range" id="p_tag_bg_alpha" min="0" max="1" step="0.05" value="0.85">
        <input type="color" id="p_tag_bg_col" value="#ffffff">
    </div>
    <div class="panel-row">
        <span>글자 색상</span>
        <input type="color" id="p_tag_text_col" value="#555555">
    </div>
    <div class="panel-row">
        <span>마우스 오버 배경</span>
        <input type="color" id="p_tag_hover_bg_col" value="#f1c40f">
    </div>
    <div class="panel-row">
        <span>마우스 오버 글자</span>
        <input type="color" id="p_tag_hover_text_col" value="#ffffff">
    </div>

    <div class="panel-sec-title">페이징 박스</div>
    <div class="panel-row">
        <span>외곽선</span>
        <label><input type="checkbox" id="p_page_border_chk" checked> 표시</label>
        <input type="color" id="p_page_border_col" value="#ffffff">
    </div>
    <div class="panel-row">
        <span>배경색 / 투명도</span>
        <input type="range" id="p_page_bg_alpha" min="0" max="1" step="0.05" value="0.85">
        <input type="color" id="p_page_bg_col" value="#ffffff">
    </div>
    <div class="panel-row">
        <span>글자 색상</span>
        <input type="color" id="p_page_text_col" value="#333333">
    </div>
    <div class="panel-row">
        <span>마우스 오버 배경</span>
        <input type="color" id="p_page_hover_bg_col" value="#ff0000">
    </div>
    <div class="panel-row">
        <span>마우스 오버 글자</span>
        <input type="color" id="p_page_hover_text_col" value="#ffffff">
    </div>

    <div style="margin-top:15px; border-top:1px solid #282f3f; padding-top:10px; text-align:right;">
        <button type="button" onclick="adminLogout()" style="background:#1f1f2a; border:1px solid #c9a86a; color:#ece5d3; font-size:11px; padding:4px 10px; border-radius:4px; cursor:pointer;">로그아웃</button>
    </div>
</div>

<nav id="siteNav">
    <a href="../index.html">Home</a>
    <a href="../Character/">Character</a>
    <a href="./index.html" class="is-active">Gallery</a>
</nav>

<div id="galleryStageArea">
    <div class="gallery-main-container">

        <div class="category-filter-wrap">
            <button class="cate-btn active" onclick="filterCategory('all', this)">전체</button>
            <button class="cate-btn" onclick="filterCategory('마피아즈', this)">마피아즈</button>
            <button class="cate-btn" onclick="filterCategory('경찰즈', this)">경찰즈</button>
        </div>

        <div id="tagFilterContainer" class="tag-filter-wrap"></div>

        <div id="log_list" class="gallery-grid-6x4"></div>

        <div id="paginationWrap" class="pagination-wrap"></div>

        <div class="bottom-control-box" style="margin-top:20px; text-align:center;">
            <button type="button" onclick="openWriteModal()" class="ctrl-btn write" title="글쓰기" style="padding:8px 20px; border-radius:15px; cursor:pointer;">✎ 글쓰기</button>
            <button type="button" onclick="loadGalleryData()" class="ctrl-btn refresh" title="새로고침" style="padding:8px 20px; border-radius:15px; cursor:pointer;">↻ 새로고침</button>
            <button type="button" id="settingBtn" onclick="toggleDesignPanel()" class="ctrl-btn setting" title="설정" style="display:none; padding:8px 20px; border-radius:15px; cursor:pointer; background:#f1c40f; border:none; font-weight:bold; color:#111; margin-left:6px;">⚙ 설정</button>
        </div>

    </div>
</div>

<!-- 폴라로이드 모달 -->
<div id="polaroidModal" class="polaroid-modal-overlay" onclick="closePolaroidModal(event)">
    <div class="modal-nav-btn modal-nav-prev" onclick="navigateModal(-1, event)"><i class="fa fa-chevron-left"></i></div>
    <div class="modal-nav-btn modal-nav-next" onclick="navigateModal(1, event)"><i class="fa fa-chevron-right"></i></div>

    <div class="polaroid-frame" onclick="event.stopPropagation()">
        <div class="polaroid-img-box" onclick="openFullImageModal()">
            <img id="modalImg" src="" alt="img">
            <div class="zoom-hover-overlay"><i class="fa fa-search-plus" style="margin-right:8px;"></i> 크게 보기</div>
        </div>
        <span id="modalTitle" class="polaroid-title-text"></span>
        <div id="modalTags"></div>
        <div id="modalDesc" class="polaroid-desc-text"></div>
        <div class="polaroid-action-btns">
            <span onclick="openEditModal()">수정</span>
            <span onclick="deleteCurrentPost()">삭제</span>
        </div>
    </div>
</div>

<div id="fullImageModal" onclick="closeFullImageModal()">
    <img id="fullImgTarget" src="" alt="full_image">
</div>

<div id="writeModal" class="uph-modal-overlay">
    <div class="write-modal-box">
        <div style="margin-bottom:15px; text-align:center;">
            <input type="text" id="wr_subject" class="write-input-dark" placeholder="제목을 입력하세요" style="text-align:center; font-weight:bold;">
        </div>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <select id="ca_name" class="write-input-dark" style="width:160px;">
                <option value="마피아즈">마피아즈</option>
                <option value="경찰즈">경찰즈</option>
            </select>
        </div>

        <div style="background:#f9f9f9; padding:15px; border-radius:10px; color:#333; margin-bottom:15px;">
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:12px; color:#888;">FILE #1</span>
                <input type="file" id="imgFileInput" accept="image/*" class="write-input-dark" style="background:#fff; color:#333; flex:1;">
                <span id="compressSizeInfo" style="font-size:12px; font-weight:bold; color:#3a9a6a; white-space:nowrap;"></span>
            </div>
        </div>

        <div style="margin-bottom:15px;">
            <textarea id="wr_content" class="write-input-dark" style="height:80px;" placeholder="코멘트 및 #태그를 입력하세요 예: #유코 #모메"></textarea>
        </div>

        <div style="display:flex; justify-content:center; gap:10px;">
            <button type="button" id="submitBtn" onclick="submitPostToGithub()" style="background:#f1c40f; border:none; color:#111; font-weight:bold; padding:8px 25px; border-radius:20px; cursor:pointer;">등록하기</button>
            <button type="button" onclick="closeWriteModal()" style="background:#555; border:none; color:#fff; font-weight:bold; padding:8px 20px; border-radius:20px; cursor:pointer;">취소</button>
        </div>
    </div>
</div>

    startEditor(false);
</script>

function hexToRgba(hex, alpha) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
}

function applyDesignStyles(c) {
    const root = document.documentElement;
    root.style.setProperty('--tag-border', c.tag_border_chk ? `1px solid ${c.tag_border_col}` : 'none');
    root.style.setProperty('--tag-bg', hexToRgba(c.tag_bg_col, c.tag_bg_alpha));
    root.style.setProperty('--tag-color', c.tag_text_col);
    root.style.setProperty('--tag-hover-bg', c.tag_hover_bg_col);
    root.style.setProperty('--tag-hover-color', c.tag_hover_text_col);

    root.style.setProperty('--page-border', c.page_border_chk ? `1px solid ${c.page_border_col}` : 'none');
    root.style.setProperty('--page-bg', hexToRgba(c.page_bg_col, c.page_bg_alpha));
    root.style.setProperty('--page-color', c.page_text_col);
    root.style.setProperty('--page-hover-bg', c.page_hover_bg_col);
    root.style.setProperty('--page-hover-color', c.page_hover_text_col);
}

async function loadGalleryData() {
    try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/Image?t=${Date.now()}`);
        const files = await res.json();
        if (!Array.isArray(files)) return;

        const webpFiles = files.filter(f => f.name.endsWith('.webp'));

        let fetchedItems = webpFiles.map((f, idx) => {
            const rawTitle = f.name.replace('.webp', '');
            let cate = '마피아즈';
            let title = rawTitle;
            let content = '';

            const cateMatch = rawTitle.match(/^\[(.*?)\]/);
            if (cateMatch) {
                cate = cateMatch[1];
                title = rawTitle.replace(/^\[.*?\]/, '');
            }

            if (title.includes('_')) {
                const parts = title.split('_');
                title = parts[0];
                content = parts.slice(1).join('_');
            }

            const parsedTags = extractTagsFromString(content || title);
            const cleanContent = extractPureTextFromString(content || title);

            return {
                id: idx,
                fileName: f.name,
                sha: f.sha,
                url: GITHUB_RAW_BASE + encodeURIComponent(f.name),
                title: title,
                category: cate,
                tags: parsedTags,
                content: cleanContent,
                rawContent: content
            };
        });

        // 1. 데이터베이스에서 카드 순서 로드 후 적용
        const { data: orderData } = await sbClient.from('layouts').select('layout_data').eq('id', 'gallery_item_order').maybeSingle();
        if (orderData && orderData.layout_data) {
            let savedOrder = orderData.layout_data;
            if (typeof savedOrder === 'string') { try { savedOrder = JSON.parse(savedOrder); } catch(e){} }

            if (Array.isArray(savedOrder)) {
                fetchedItems.sort((a, b) => {
                    let indexA = savedOrder.indexOf(a.fileName);
                    let indexB = savedOrder.indexOf(b.fileName);
                    if (indexA === -1) indexA = 9999;
                    if (indexB === -1) indexB = 9999;
                    return indexA - indexB;
                });
            }
        }
        galleryItems = fetchedItems;

        // 2. 데이터베이스에서 태그 순서 로드 후 적용
        const tagSet = new Set();
        galleryItems.forEach(item => item.tags.forEach(t => tagSet.add(t)));
        let fetchedTags = Array.from(tagSet);

        const { data: tagOrderData } = await sbClient.from('layouts').select('layout_data').eq('id', 'gallery_tag_order').maybeSingle();
        if (tagOrderData && tagOrderData.layout_data) {
            let savedTagOrder = tagOrderData.layout_data;
            if (typeof savedTagOrder === 'string') { try { savedTagOrder = JSON.parse(savedTagOrder); } catch(e){} }

            if (Array.isArray(savedTagOrder)) {
                fetchedTags.sort((a, b) => {
                    let indexA = savedTagOrder.indexOf(a);
                    let indexB = savedTagOrder.indexOf(b);
                    if (indexA === -1) indexA = 9999;
                    if (indexB === -1) indexB = 9999;
                    return indexA - indexB;
                });
            }
        }
        tagList = fetchedTags;

        buildTagFilterButtons();
        applyFilters();
    } catch (e) {
        console.error('Gallery Load Error:', e);
    }
}

function extractTagsFromString(str) {
    if (!str) return [];
    const matches = str.match(/#([^\s#]+)/g);
    return matches ? matches.map(t => t.replace('#', '')) : [];
}

function extractPureTextFromString(str) {
    if (!str) return '';
    return str.replace(/#([^\s#]+)/g, '').trim();
}

        if (isAdmin) {

        }

    });

function setupCustomDrag(element, type) {
    let isDragging = false;
    let startX = 0, startY = 0;
    let offsetX = 0, offsetY = 0;
    let placeholder = document.createElement('div');
    placeholder.className = (type === 'card') ? 'card-placeholder' : 'tag-placeholder';

    element.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;

        const rect = element.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        const initialWidth = rect.width;
        const initialHeight = rect.height;

        const onPointerMove = (moveEv) => {
            const dist = Math.hypot(moveEv.clientX - startX, moveEv.clientY - startY);
            if (!isDragging && dist > 5) {
                isDragging = true;

                element.style.width = `${initialWidth}px`;
                element.style.height = `${initialHeight}px`;

                placeholder.style.width = `${initialWidth}px`;
                placeholder.style.height = `${initialHeight}px`;

                element.classList.add('dragging-float');
                
                const container = (type === 'card') ? document.getElementById('log_list') : document.getElementById('tagFilterContainer');
                container.insertBefore(placeholder, element);

                try { element.setPointerCapture(e.pointerId); } catch(err){}
            }

            if (isDragging) {
                element.style.left = `${moveEv.clientX - offsetX}px`;
                element.style.top = `${moveEv.clientY - offsetY}px`;

                const container = (type === 'card') ? document.getElementById('log_list') : document.getElementById('tagFilterContainer');
                const targets = Array.from(container.querySelectorAll(type === 'card' ? '.card-item:not(.dragging-float)' : '.tag-btn:not(.dragging-float)'));

                let closestTarget = null;
                let insertAfter = false;

                for (let t of targets) {
                    const r = t.getBoundingClientRect();
                    const centerX = r.left + r.width / 2;

                    if (moveEv.clientY >= r.top && moveEv.clientY <= r.bottom) {
                        if (moveEv.clientX > centerX) {
                            closestTarget = t;
                            insertAfter = true;
                        } else {
                            closestTarget = t;
                            insertAfter = false;
                            break;
                        }
                    }
                }

                if (closestTarget) {
                    if (insertAfter) {
                        container.insertBefore(placeholder, closestTarget.nextSibling);
                    } else {
                        container.insertBefore(placeholder, closestTarget);
                    }
                }
            }
        };

        const onPointerUp = (upEv) => {
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);

            try { element.releasePointerCapture(e.pointerId); } catch(err){}

            if (isDragging) {
                element.classList.remove('dragging-float');
                element.style.left = '';
                element.style.top = '';
                element.style.width = '';
                element.style.height = '';

                if (placeholder.parentNode) {
                    const container = (type === 'card') ? document.getElementById('log_list') : document.getElementById('tagFilterContainer');
                    container.insertBefore(element, placeholder);
                    placeholder.remove();

                    if (type === 'card') {
                        const newOrderIndices = Array.from(container.querySelectorAll('.card-item')).map(el => parseInt(el.dataset.index));
                        const newFiltered = newOrderIndices.map(i => filteredItems[i]);
                        
                        // 전체 galleryItems에도 바뀐 순서 즉시 반영
                        const updatedGallery = [...galleryItems];
                        let filterIdx = 0;
                        galleryItems.forEach((item, idx) => {
                            if (filteredItems.includes(item)) {
                                updatedGallery[idx] = newFiltered[filterIdx++];
                            }
                        });
                        galleryItems = updatedGallery;
                        filteredItems = newFiltered;

                        renderGalleryGrid();
                    } else {
                        const newTags = Array.from(container.querySelectorAll('.tag-btn[data-tag-index]')).map(el => tagList[parseInt(el.dataset.tagIndex)]);
                        tagList = newTags;
                        buildTagFilterButtons();
                    }
                }
                
                setTimeout(() => { isDragging = false; }, 50);
            }
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
    });

    element.addEventListener('click', (e) => {
        if (isDragging) {
            e.preventDefault();
            e.stopPropagation();
        }
    }, true);
}

function renderPagination(totalPages) {
    const nav = document.getElementById('paginationWrap');
    if (totalPages <= 1) { nav.innerHTML = ''; return; }

    let html = `<button class="page-btn" onclick="changePage(${Math.max(1, currentPage - 1)})">«</button>`;
    for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" onclick="changePage(${Math.min(totalPages, currentPage + 1)})">»</button>`;
    nav.innerHTML = html;
}

document.getElementById('imgFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const origStr = (file.size / 1024).toFixed(0) + 'KB';
    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        canvas.toBlob(function(blob) {
            convertedWebpBlob = blob;
            const newStr = (blob.size / 1024).toFixed(0) + 'KB';
            document.getElementById('compressSizeInfo').textContent = `${origStr} → ${newStr}`;
        }, 'image/webp', 0.90);
    };
});

async function submitPostToGithub() {
    const token = getGithubToken();
    if (!token) { alert('토큰이 설정되지 않았습니다.'); return; }

    const cate = document.getElementById('ca_name').value;
    const title = document.getElementById('wr_subject').value.trim() || 'Untitled';
    const content = document.getElementById('wr_content').value.trim();
    const newFileName = `[${cate}]${title}_${content}.webp`;

    if (isEditMode && currentEditingItem) {
        const latestSha = await fetchLatestSha(currentEditingItem.fileName);
        await deleteGithubFile(currentEditingItem.fileName, latestSha, token);

        if (convertedWebpBlob) {
            await uploadGithubFile(newFileName, convertedWebpBlob, token);
        } else {
            const response = await fetch(currentEditingItem.url);
            const blob = await response.blob();
            await uploadGithubFile(newFileName, blob, token);
        }
        alert('수정 완료!');
    } else {
        if (!convertedWebpBlob) { alert('이미지를 선택해주세요.'); return; }
        await uploadGithubFile(newFileName, convertedWebpBlob, token);
        alert('등록 성공!');
    }

    closeWriteModal();
    loadGalleryData();
}

async function uploadGithubFile(fileName, blob, token) {
    const reader = new FileReader();
    return new Promise((resolve) => {
        reader.readAsDataURL(blob);
        reader.onloadend = async function() {
            const base64Content = reader.result.split(',')[1];
            const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/Image/${encodeURIComponent(fileName)}`;

            await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Upload ${fileName}`, content: base64Content })
            });
            resolve();
        };
    });
}

async function fetchLatestSha(fileName) {
    try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/Image/${encodeURIComponent(fileName)}?t=${Date.now()}`);
        const data = await res.json();
        return data.sha;
    } catch(e) { return null; }
}

async function deleteGithubFile(fileName, sha, token) {
    const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/Image/${encodeURIComponent(fileName)}`;
    const res = await fetch(apiUrl, {
        method: 'DELETE',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Delete ${fileName}`, sha: sha })
    });
    return res.ok;
}

async function deleteCurrentPost() {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const item = filteredItems[currentModalIndex];
    const token = getGithubToken();
    if (!token || !item) return;

    const sha = await fetchLatestSha(item.fileName) || item.sha;
    const success = await deleteGithubFile(item.fileName, sha, token);

    if (success) {
        alert('성공적으로 삭제되었습니다.');
        document.getElementById('polaroidModal').style.display = 'none';
        loadGalleryData();
    } else {
        alert('삭제 실패');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    checkAdminStatus();
    loadDesignSettings();
    syncMainBackground();
    loadGalleryData();
});
</script>
