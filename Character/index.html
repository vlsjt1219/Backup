<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{if(localStorage.getItem('mafiaz_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
    <title>MAFIAZ - Character</title>

    <!-- Supabase SDK & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- CSS 파일 연동 -->
    <link rel="stylesheet" href="../editor.css">
    <link rel="stylesheet" href="../site.css">
    <link rel="stylesheet" href="./character.css">

    <!-- 웹폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Zen+Antique&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;700&family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
</head>
<body>

<!-- 페이지 뒷배경 -->
<div id="pageBg"></div>

<!-- 왼쪽 네비게이션 -->
<nav id="siteNav">
    <a href="../index.html">Home</a>
    <a href="../Story/index.html">Story</a>
    <a href="./index.html" class="is-active">Character</a>
    <a href="../Gallery/index.html">Gallery</a>
</nav>

<!-- 화면 스테이지 영역 -->
<div id="stageArea">
  <div id="stageFrame">
    <div id="mh-gpfto" class="mh">
      <div class="mh-bg"></div>
      <div class="mh-fx"></div>
      <div class="mh-in">
        <div class="mh-win">
          <div class="mh-bar">
            <span class="mh-ttl">CHARACTER</span>
            <span class="mh-btns" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
          <div class="char-adminbar" id="adminBar" style="display:none;">
              <span>🛠️ 관리자 모드 — 글쓰기·수정·삭제가 가능합니다.</span>
              <button type="button" class="btn" id="logoutBtn">로그아웃</button>
          </div>

          <!-- 메인 페이지와 완전히 동일한 .mh-body.mh-free 구조 적용 -->
          <div class="mh-body mh-free" id="draggableGallery" style="position: relative; width: 100%; height: 100%;">
            <!-- 기존 캐릭터 게시판을 내부 배경 레이어로 배치 -->
            <div id="charApp" class="char-scroll" style="position: absolute; inset: 0; overflow-y: auto; z-index: 1; pointer-events: auto;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../common.js"></script>
<script src="../editor.js"></script>
<script>
    MZ.initLogin({ onLogin: () => location.reload(), onLogout: () => location.reload() });
    startEditor(MZ.isAdmin(), 'character'); // 👈 캐릭터 페이지 전용 데이터 사용
</script>
<script src="./character.js"></script>

</body>
</html>
